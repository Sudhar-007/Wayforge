services:
  postgres:
    image: postgres:16
    container_name: pathfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pathfinder}
      POSTGRES_USER: ${POSTGRES_USER:-pathfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - "5432:5432"
    volumes:
      - pathfinder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathfinder} -d ${POSTGRES_DB:-pathfinder}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pathfinder_pgdata:
